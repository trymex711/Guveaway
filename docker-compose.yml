services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: giveaway
      POSTGRES_PASSWORD: giveaway
      POSTGRES_DB: giveaway
    ports:
      - "5432:5432"
    volumes:
      - giveaway_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giveaway"]
      interval: 5s
      retries: 10
volumes:
  giveaway_db:
